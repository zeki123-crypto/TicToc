services:
  bot:
    build: .
    container_name: tictoc-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override storage to point at the bundled Redis service.
      STORAGE_TYPE: redis
      REDIS_DSN: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - downloads:/app/downloads

  redis:
    image: redis:7-alpine
    container_name: tictoc-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  downloads:
